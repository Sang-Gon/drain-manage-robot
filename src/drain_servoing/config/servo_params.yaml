# =============================================================================
#  drain_servoing 파라미터
# =============================================================================
#  이 파일을 고치면 재빌드 없이 노드 재시작만으로 반영된다.
#  (colcon build 로 install 에 복사된 사본이 실행되므로 소스를 고쳤으면 재빌드)
# =============================================================================

drain_servo_node:
  ros__parameters:

    detection_topic: "/detections/drains"
    cmd_topic: "/cmd_vel_servo"

    # ── 속도 ─────────────────────────────────────────────────────────────
    #  ★ 명령 rpm 하한 60 을 반드시 지킬 것 (2026-08-22 육안 실측) ★
    #    명령rpm = v x 269.0   ->  0.223 m/s 가 60rpm 이다. 그 아래는 뚝뚝 끊긴다.
    #    아래 값은 회피 노드와 같게 맞췄다 (0.45 -> 121rpm · 2.25 -> ±121rpm)
    # ★★ [2026-08-30] 사용자 결정 — 하한을 40rpm 으로 낮추고 41rpm 으로 주행 ★★
    #   0.225(60.5rpm)에서도 배수구를 지나쳤다(오버슛). 그래서 더 내렸다.
    #   ★ 41rpm 은 문서상 실용 하한 60rpm 아래다 ★ 미해결 3-B 는 명령 30rpm 에서
    #   '뚝뚝 끊긴다'고 기록돼 있다. 41 은 30 과 60 사이라 어떻게 도는지 실측 전이다.
    #   끊기면 이 값을 올릴 것. 되돌리려면 0.45(121rpm).
    approach_speed: 0.1524       # [m/s] 정렬된 뒤 직진 접근 (명령 41.0rpm)
    align_turn_speed: 0.762      # [rad/s] 제자리 선회 (바퀴 명령 41.0rpm · 원래 2.25)

    # ── 정렬 문턱 (cx_norm: -1.0 왼쪽끝 ~ 0 중앙 ~ +1.0 오른쪽끝) ─────────
    #  ★ exit < enter 여야 한다 ★ 같으면 문턱 근처에서 채터링한다.
    #  640px 기준 enter 0.20 은 중앙에서 64px 벗어난 지점이다.
    align_enter: 0.20
    align_exit: 0.10

    # ── 정지 문턱 (area_ratio = bbox 면적 / 화면 면적) ────────────────────
    #  ★ 거리가 아니라 '거리 대용'이다 ★ 배수구 크기가 다르면 값이 달라진다.
    #  TOF 가 붙으면 이 판정을 TOF 거리로 옮길 것 (미해결 11번).
    #  ★ resume < stop 이어야 한다 ★ 같으면 정지/재출발을 반복한다.
    #
    #  ★ [2026-08-24] 0.25 -> 0.11 로 내렸다 ★
    #  사용자가 실제 배수구 앞에서 "여기서 멈췄으면 좋겠다"고 지정한 위치에서
    #  화면을 보니 배수구가 약 168x197px / 640x480 = **면적비 0.11** 이었다.
    #  0.25 는 화면의 1/4 로, 그 자리에서는 도달할 수 없는 크기다 —
    #  그대로 두면 ARRIVED 가 영영 안 걸리고 로봇이 배수구를 밟고 지나간다.
    #
    #  ★★ [2026-08-29 실측으로 교체] 0.11 -> 0.071 ★★
    #  옛 0.11 은 **탐지기 출력이 아니라 사람이 화면에서 잰 값**이었다(그때는
    #  모델이 이 배수구를 한 번도 탐지하지 못했다). 그 주석에 "탐지가 되기 시작하면
    #  /detections/drains 의 area_ratio 로 다시 확인할 것"이라 적어 뒀고, **오늘 했다.**
    #  ☆ 잰 방법 ☆ 사용자가 **bbox 가 생기는 가장 가까운 자리**에 로봇을 두고,
    #    그 자리에서 20초(79회 조회 중 77회 탐지 · 97%) 표본을 받았다:
    #      area_ratio  최소 0.0633 · 중앙값 0.0713 · 최대 0.0787
    #      score       최소 0.306  · 중앙값 0.417  · 최대 0.545
    #  ★ 이 자리가 '가장 가까운 자리'라는 것이 중요하다 ★ 더 붙으면 배수구가
    #    화면에서 빠져나가 bbox 가 사라진다. **여기가 서보가 도달할 수 있는 한계**다.
    #  ☆ 중앙값을 그대로 쓴 이유 ☆ ARRIVED 에는 히스테리시스가 있다 —
    #    한 프레임이라도 stop 을 넘으면 ARRIVED 로 걸리고, resume 아래로
    #    **떨어지기 전까지 풀리지 않는다.** 그래서 절반만 넘겨도 확실히 잡힌다.
    #  ★ 여기서 멈춘 자리는 배수구 '위'가 아니다 ★ 사용자 실측으로 **배수구 중심까지
    #    1.2m 남는다** — 그 전진은 task_params.yaml 의 mount_distance 가 한다.
    #
    #  ★★ [2026-09-06 사용자 지시] 0.071 -> 0.060 · '조금만 더 키운다' ★★
    #  원문: "서보잉 arrived area를 조금만 더 키워줄 수 있어? 배수구를 자꾸 지나가."
    #  ★ '넓힌다'는 판정 영역이지 문턱 숫자가 아니다 ★ ARRIVED 는
    #    `area_ratio >= stop_area_ratio` 이므로 **문턱을 내려야 판정 영역이 넓어진다.**
    #    올리면 더 붙어야 서고 — 지나가는 증상이 더 심해진다. 그래서 내렸다.
    #  ☆ 0.060 인 이유 ☆ 08-29 표본의 **최소 0.0633** 바로 아래다.
    #    그 표본은 '가장 가까운 자리'에서 잰 것이라, 0.060 이면 거기 닿기
    #    **직전에** ARRIVED 가 걸린다. 면적비는 거리의 제곱에 반비례하므로
    #    0.071 -> 0.060 은 거리로 sqrt(0.071/0.060) = **약 8.8% 더 멀리**(≈ +10cm) 선다.
    #  ★ 대가: mount_distance(1.20m)가 그만큼 모자라진다 ★ 그 값은 옛 정지
    #    자리에서 배수구 중심까지 실측한 것이다. **실물에서 다시 잴 것**
    #    (계산상 1.20 -> 약 1.31). 아직 안 고쳤다 — 실측 없이 바꿀 값이 아니다.
    stop_area_ratio: 0.060
    #  0.72 비율 유지 (0.060 x 0.72 = 0.043). 이만큼 멀어져야 다시 접근한다.
    resume_area_ratio: 0.043

    # ── 탐지 선별 ────────────────────────────────────────────────────────
    #  detector 의 conf_threshold(0.3) 보다 높게 두어 한 번 더 거른다.
    #  ★★ [2026-08-29 실측·사용자 결정] 0.40 -> 0.30 ★★
    #  라이브 참긍정을 처음 본 날, 실물 배수구 앞에서 20초(67표본) 재 보니
    #  score 가 **최소 0.303 · 중앙값 0.390 · 최대 0.484** 였다.
    #  ★ 0.40 이면 그중 27개(40%)만 통과한다 — 나머지 60%를 서보가 버렸다 ★
    #  그래서 탐지가 되고 있는데도 로그에 '배수로 놓침 · 탐색 주행으로 돌아간다'
    #  가 반복해서 찍혔다. **깜빡임의 원인이 모델이 아니라 이 문턱이었다.**
    #  ☆ 0.30 인 이유 ☆ .hef 에 박힌 NMS score threshold 가 **0.300** 이라
    #    칩이 이미 그 아래를 버린다. 0.30 은 "칩이 준 것은 전부 쓴다"는 뜻이다.
    #  ★ 대가: 약한 오탐도 그대로 들어온다 ★ 오탐이 보이기 시작하면 0.35 부터 다시 볼 것.
    min_score: 0.30
    #  카메라 10Hz 기준 0.5s = 프레임 5개. 한두 개 놓쳐도 안 흔들린다.
    detection_timeout: 0.5

    # ── 놓침 복귀 (RECOVER) ──────────────────────────────────────────────
    #  ★ 2026-08-25 사용자 지시로 들어온 동작 ★
    #  서보잉 중 장애물이 나타나면 mux 우선순위 ② 로 회피가 이긴다. 회피의 회전은
    #  제자리 선회라 **카메라가 통째로 돌아가고 배수로가 화면 밖으로 나간다.**
    #  그전에는 그냥 잃었다 — 회피가 끝나면 로봇은 돌아간 방향으로 그냥 직진했다.
    #
    #  이제: recover_distance 만큼 직진 -> 잃는 동안 돌아간 만큼 반대로 되돌린다.
    #
    #  ★ 되돌리기 전에 앞으로 먼저 가는 이유 ★ (사용자 지시)
    #    제자리에서 되돌리면 방금 피한 그 장애물을 다시 정면으로 본다 ->
    #    회피가 또 이기고 또 돌고 -> **같은 자리에서 맴돈다.**
    #    먼저 나아가면 위치가 바뀌어 같은 그림이 반복되지 않는다.
    #
    #  ★ 아래 다섯 개 전부 실측하지 않았다 ★ 실물 앞에서 맞출 것.
    recover_enable: true

    #  되돌리기 전에 나아가는 거리 [m]. 개루프(시간 x 속도)다.
    recover_distance: 0.20
    #  개루프 전진 보정. TaskManager 의 advance_calib 와 같은 뜻·같은 재는 법:
    #  바닥에 내려놓고(바퀴를 띄우면 의미 없다) 한 번 달려 실제 이동거리 D 를 재고
    #    recover_calib = recover_distance / D
    #  저속 손실(미해결 3-B) 때문에 지금 상태로는 20cm 보다 조금 덜 갈 것으로 본다.
    recover_calib: 1.0

    #  이만큼(rad) 이상 돌아갔을 때만 '회피가 시야를 돌렸다'로 본다.
    #  ★ 이 문턱이 하는 일 ★ **탐지 깜빡임**과 **회피의 시야 탈취**를 가른다.
    #    깜빡임에도 복귀가 발동하면 ARRIVED 직전에 20cm 를 전진해
    #    **배수로를 밟고 지나간다.** 그래서 '돌았을 때만' 발동시킨다.
    #  0.30rad = 약 17도. 카메라 화각을 실측하지 않아서(미해결 9번) 배수로가
    #  실제로 화면을 벗어나는 각도를 모른다 — 출발점일 뿐이다.
    #  올리면: 살짝 돈 경우를 놓친다 / 내리면: 깜빡임에도 전진해 지나칠 수 있다.
    recover_min_yaw: 0.30

    #  되돌리기 회전의 개루프 보정. 되돌린 뒤 배수로가
    #    화면 반대쪽으로 지나쳐 있으면 -> 낮춘다 (덜 돌린다)
    #    아직 화면 밖이면                -> 올린다 (더 돌린다)
    recover_turn_calib: 1.0
    #  되돌리기 회전 상한 [s]. 오래 회피했으면 그만큼 되돌리는 데도 오래 걸린다.
    #  2.25rad/s 기준 3.0s = 약 6.75rad(387도) — 사실상 한 바퀴가 상한이다.
    recover_turn_max: 3.0

    #  마지막 탐지로부터 이 시간 안에서만 복귀를 시도한다 [s].
    #  ★ 왜 창이 필요한가 ★ 그보다 오래 회피했다면 로봇이 그동안 **이동**했다.
    #    회전만 되돌려도 그 자리에 배수로가 없다. 헤매느니 탐색 주행이 낫다.
    #  통제권을 못 받고 기다리는 예산으로도 같은 값을 쓴다
    #  (회피가 계속 이기면 이 시간 뒤 복귀를 접는다).
    recover_arm_window: 5.0

    # ── 놓침 유지 (HOLD) ─────────────────────────────────────────────────
    #  ★★ [2026-09-06 사용자 결정] "놓쳤을 때 가속 금지" ★★
    #  사용자가 본 증상: **초록 bbox 가 주황 견본을 한참 넘어서야 로봇이 선다.**
    #  ☆ 원인 ☆ 탐지가 detection_timeout(0.5s) 넘게 끊기면 서보가 SEARCH 로
    #    떨어지면서 **통제권을 놓았고**, 그러면 mux ⑤ 가 회피의 **탐색 전진
    #    0.45 m/s** 를 그대로 통과시켰다. 접근 속도 0.1524 의 **2.95배**다 —
    #    **쫓던 배수구를 놓친 그 순간 로봇이 3배로 빨라져 지나가 버린다.**
    #    끊긴 채 5초면 2.25m 다.
    #  ☆ 근거(2026-09-06 실측) ☆ 도착 로그 문턱이 0.071 인데 **0.085** 로 찍혔다
    #    (면적 20% 초과 = 약 9% 더 가까이). 한 세션에 '놓침 · 복귀 안 함' 4회 / 도착 3회.
    #  이제 쫓던 목표를 놓치면 이 시간 동안 **통제권을 쥔 채 그 자리에 선다.**
    #  ★ 회피를 이기는 것이 아니다 ★ mux 에서 서보(④)는 '회피가 회피 중'(②)보다
    #    아래다. 장애물이 있으면 회피가 그대로 이긴다. 바뀌는 것은
    #    **회피가 그냥 순항 중일 때 그 순항을 통과시키지 않는 것**뿐이다.
    #  ★ 0 이하로 두면 옛 동작(놓치는 즉시 탐색 전진)으로 돌아간다 ★
    #  ★ recover_arm_window 와 같은 5.0 인 것은 의도다 ★ 복귀 발동을 지켜보는
    #    창과 같은 창이라 둘이 함께 닫힌다 — '서 있다가 갑자기 달리는' 틈이 없다.
    #  ☆ 대가 ☆ 배수구가 진짜로 사라졌으면 최대 5초 서 있다가 탐색으로 돌아간다.
    lost_hold_seconds: 5.0

    publish_rate: 20.0

cmd_mux_node:
  ros__parameters:

    avoid_topic: "/cmd_vel_avoid"
    servo_topic: "/cmd_vel_servo"
    #  서보가 통제권을 주장하는지. 탐지가 없으면 false 가 되어
    #  회피의 전진(탐색 주행)이 통과한다.
    servo_active_topic: "/drain_servo_node/active"
    out_topic: "/cmd_vel"

    avoid_timeout: 0.5
    servo_timeout: 0.5

    #  ★★★ 바닥에 내릴 때는 반드시 true ★★★
    #  false 로 두면 회피 노드가 죽어도 서보가 계속 달린다.
    #  /scan 이 3초씩 조용히 끊긴 전력이 있다(미해결 12번).
    #  false 는 **바퀴를 띄운 벤치 시험 전용**이다.
    require_avoid: true

    #  ★★★ 바닥 주행과 시연에서는 반드시 true ★★★  (require_avoid 와 같은 급이다)
    #  TaskManager 가 내는 임무 게이트(/task/allow_drive)를 필수로 볼 것인가.
    #  false : 게이트가 없으면 '허용'으로 본다 — TaskManager 없이 돌리던
    #          서보 단독 시험 · 벤치 시험 구성이 그대로 살아야 하므로 이게 기본이다.
    #  true  : 게이트가 없으면 정지. TaskManager 가 죽으면 로봇이 선다.
    #  ★ 기본값을 true 로 바꾸지 말 것 ★ 바꾸면 TaskManager 없는 시험이 전부 막힌다.
    #    시연은 mission.launch.py 의 require_task:=true 로 켠다.
    require_task: false

    #  angular.z 가 이 값 이하이면 '직진'으로 본다.
    straight_eps: 0.05

    publish_rate: 20.0
