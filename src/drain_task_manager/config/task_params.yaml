# =============================================================================
#  drain_task_manager 파라미터
# =============================================================================
#  이 파일을 고치면 재빌드 없이 노드 재시작만으로 반영된다.
#  (colcon build 로 install 에 복사된 사본이 실행되므로 소스를 고쳤으면 재빌드)
# =============================================================================

task_manager_node:
  ros__parameters:

    # ── 자동 시작 ────────────────────────────────────────────────────────
    #  ★★★ 기본값 false 를 함부로 바꾸지 말 것 ★★★
    #  true 로 두면 전원이 들어오고 10초 뒤 로봇이 사람 명령 없이 출발한다.
    #  이 프로젝트의 안전 규칙(바퀴 확인 · 0x200 송신자 확인)은 전부
    #  "사람이 시작한다"를 전제로 한다. 시연 launch 에서만 켤 것.
    autostart_enable: false
    autostart_delay: 10.0

    # ── 시동 전 점검 ─────────────────────────────────────────────────────
    #  못 갈 이유는 출발 전에 찾는 게 싸다.
    #  캡쳐 순간에 카메라가 없으면 임무 전체가 헛수고가 된다.
    #  ★ [2026-08-29] 점검이 미통과여도 이 시간 동안은 다시 본다 ★
    #  카운트다운 0초에 딱 맞춰 장치가 준비되어 있으리라는 보장이 없다.
    #  실제로 첫 서비스 구동(21:26)에서 sllidar 가 'Can not start scan: 80008002'
    #  로 늦게 살아나 /cmd_vel_avoid 가 없었고, 임무가 그대로 ABORT 됐다.
    #  ★ ABORT 는 되돌아오지 않는다 ★ 선 없이 도는 구성에서는 사람이 가서 다시 켜야 한다.
    #  ☆ 점검 조건을 무르게 한 것이 아니다 ☆ 통과 기준은 그대로고 기다려 주기만 한다.
    #  0 으로 두면 옛 동작(즉시 ABORT)이 된다.
    #  [2026-08-29 22:20] 20 -> 40. sllidar 가 respawn(3초 간격)으로 되살아나는
    #  시간을 덮어야 한다. 20초면 재시도 5~6번인데 실패가 연달아 나면 모자란다.
    preflight_grace: 40.0
    preflight_require_avoid: true    # 회피 입력(=LiDAR) 살아있는가
    preflight_require_can: true      # 모터 fault 0 · CAN 정상인가

    # ── 도착 판정 ────────────────────────────────────────────────────────
    #  ARRIVED 는 area_ratio(0.25) 기반이라 한 프레임 튀면 오인한다(미해결 16번).
    #  카메라 10Hz 기준 1.0s = 10프레임 연속 유지되어야 인정한다.
    arrived_debounce: 1.0

    # ── 배수구 진입 전진 (MOUNTING) ──────────────────────────────────────
    #  ★ 서보의 ARRIVED 는 '배수구 앞'이지 '위'가 아니다 ★
    #  area_ratio 0.25 는 배수구가 화면의 1/4 을 채운 지점일 뿐이다.
    #  TOF 6개가 배수구를 보려면 로봇이 그 위에 올라가 있어야 한다.
    #  ★★★ 이 값은 실측하지 않았다. 0.30 은 근거 없는 출발값이다 ★★★
    #  ☆ 정하는 법 ☆ 실제 배수구 앞에서 서보를 세우고, 그 자리에서 배수구
    #     중심까지의 거리를 재서 넣는다. 개루프 오차는 mount_calib 로 뺀다.
    #  0 이하로 두면 진입 전진을 건너뛴다(2026-08-24 이전 동작으로 되돌리는 스위치).
    #  ★★ [2026-08-29 사용자 실측] 0.30 -> 1.20 ★★
    #  "지금 자리가 바운딩 박스가 생기는 배수구에서 가장 가까운 자리고
    #   여기서 120센치 전진을 넣어야 배수구 위에 정렬 돼" (사용자 원문)
    #  옛 0.30 은 근거 없는 출발값이었다. 서보가 설 수 있는 한계 자리
    #  (stop_area_ratio 0.071 · servo_params.yaml 참조)에서 배수구 중심까지가 1.2m 다.
    #  ★ 개루프 오차가 0.30 일 때보다 4배로 커진다 ★ 시간 x 속도로만 가므로
    #    저속 손실(미해결 2번)이 그대로 거리 오차가 된다. 1.2m 에서 8% 만 부족해도 10cm 다.
    #  ★★★ [2026-08-30] 공식이 뒤집혀 있었다 — 고쳤다 ★★★
    #  옛 주석은 mount_calib = 1.20 / D 였다. **그대로 넣으면 더 짧아진다.**
    #  코드는  duration = 거리 / (속도 x calib)  이므로, 모자라게 갔는데 calib 을
    #  1 보다 크게 넣으면 시간이 줄어 더 모자란다. 옛 예시(0.46m 갔으면 1.087)를
    #  실제로 넣으면 0.46 -> 0.42m 로 악화된다.
    #  ☆ 맞는 식 ☆   calib = 실제 D / 명령거리     (1 보다 작아진다)
    # ── 도착 후 정지 (SETTLE) ────────────────────────────────────────────
    #  ★ [2026-08-30 사용자 지시] ★ "서보잉 구역 안에 바운딩 박스가 들어가고
    #  전진 120cm 하기 전에 5초간 멈추자"
    #  이 동안 로봇은 완전히 선다(allow_drive=False). 0 이하면 상태를 건너뛴다.
    settle_seconds: 5.0

    mount_distance: 1.20
    # ★★ [2026-08-30] 41rpm (사용자 결정) ★★ 소요시간이 원래의 약 3배가 된다
    mount_speed: 0.1524       # 명령 41.0rpm (원래 0.45=121rpm)
    #  ★★ [2026-08-30 실측] 41rpm 에서 1.20m 명령 -> 실제 0.70m (효율 58.3%) ★★
    #  단순비는 0.70/1.20 = 0.583 이지만 **출발 지연을 빼야 맞다**:
    #  같은 속도인데 ADVANCING 효율이 32% 로 절반이었다 -> 고정 지연이 있다는 뜻.
    #  두 측정을 풀면  지연 1.94초 · 실효속도 0.117m/s (명령 0.1524 의 77%).
    #  그래서 mount_calib = 1.20 / (0.1524 x 12.16초) = 0.648  (소요 7.90 -> 12.16초)
    #  ☆ 속도를 바꾸면 이 값도 다시 재야 한다 ☆ 지연이 속도에 따라 달라진다.
    mount_calib: 0.648        # [2026-08-30 실측] 옛 1.0 -> 0.70m 밖에 안 갔다
    mount_grace: 0.5          # 출발 직후 이 시간은 mux 출처를 보지 않는다

    #  ★★ [2026-09-06 사용자 지시] 회피가 끼면 진입 시계를 멈추고 기다린다 ★★
    #  원문: "mux source가 TASK일 때만 MOUNTING 시간을 누적 / AVOID가 끼면 timer
    #        일시정지 / 회피 끝나고 TASK가 다시 선택되면 남은 시간부터 계속 /
    #        실제 task 전진이 mount_duration만큼 적용된 뒤에만 ToF로 넘어가도록"
    #  ☆ 무엇이 문제였나 ☆ 그전에는 상태에 들어온 뒤 '흐른 시간'으로 쟀고,
    #    회피가 이기면 **그 자리에서 접었다**(08-24 결정). 09-06 로그 11판 중
    #    **8판이 0.55초 지점에서 접혔다** — 도착 지점의 front 가 0.40~0.49m 라
    #    safe_distance(0.50) 아래여서 회피가 곧바로 이겼기 때문이다.
    #    그래서 "1.20m 를 가야 하는데 거의 안 움직이고 ToF 로 넘어감" 이 됐다.
    #
    #  ☆ 이 값은 '기다려 주는 예산' 이다 ☆ TASK 가 아닌 채로 보낸 시간이
    #    이만큼을 넘으면 **옛 동작(그 자리에서 판정)** 으로 떨어진다.
    #  ★ 무한 대기로 두지 않는 이유 ★ 배수구 앞이 원래 좁으면 회피가 영영
    #    안 물러날 수 있다. 그러면 mission_timeout(300초) 뒤 **ABORT** 인데
    #    그건 '덜 정확해도 재는' 지금 동작보다 나쁘다.
    #  ★ 실측하지 않은 값이다 ★ 회피가 한 번 발동해 물러나는 데 실제로 몇 초가
    #    걸리는지 아직 안 쟀다. 짧으면 옛 동작으로 자주 떨어지고, 길면 그만큼
    #    배수구 앞에 오래 서 있는다. 실물에서 로그의 '대기 n/15.0초'를 보고 정할 것.
    #  ★ 0 이하로 두면 기다리지 않는다 = 옛 동작으로 정확히 되돌아간다 ★
    #    (내 변경이 원인인지 가리는 A/B 스위치로 쓸 것)
    mount_wait_budget: 15.0

    # ── 전진 ─────────────────────────────────────────────────────────────
    #  ★ 판정 결과와 무관하게 항상 지난다 ★ (2026-08-24 사용자 결정)
    #  옛 동작은 NEEDED 일 때만 전진·캡쳐했다. 지금은 청소가 필요하든 아니든
    #  50cm 전진 후 캡쳐한다 — "깨끗했다"도 사진이 있어야 확인이 된다.
    #  ★ /odom 을 못 쓰므로 개루프(시간 x 속도)다 ★ (미해결 15번)
    #  저속 손실이 있어 명령대로 안 간다(미해결 2번) -> advance_calib 로 보정.
    #  ★★★ [2026-08-30] 공식이 뒤집혀 있었다 — 고쳤다 ★★★
    #  옛 주석은 advance_calib = 0.50 / D 였다. 방향이 반대다(mount_calib 주석 참조).
    #  ☆ 맞는 식 ☆  바닥에 내려놓고(바퀴를 띄우면 의미 없다) 한 번 달려
    #     실제 이동거리 D 를 재고   calib = D / 0.50   를 넣는다.
    #     예: 0.46m 갔다면 0.46/0.50 = 0.92 (시간이 늘어 더 간다)
    advance_distance: 0.50
    advance_speed: 0.1524     # [2026-08-30] 명령 41.0rpm (원래 0.45=121rpm)
    #  ★★ [2026-08-30 실측] 41rpm 에서 0.50m 명령 -> 실제 0.16m (효율 32.0%) ★★
    #  구간이 짧아 출발 지연 1.94초가 통째로 손해다 — 그래서 MOUNTING 보다 나쁘다.
    #  advance_calib = 0.50 / (0.1524 x 6.20초) = 0.529  (소요 3.30 -> 6.20초)
    advance_calib: 0.529      # [2026-08-30 실측] 옛 1.0 -> 0.16m 밖에 안 갔다
    advance_grace: 0.5        # 출발 직후 이 시간은 mux 출처를 보지 않는다
    #  ★ 사용자 결정(2026-08-23): 전진이 끊겨도 재시도하지 않는다 ★
    #  회피로 방향이 틀어지면 배수구가 화면 밖으로 나가 로봇이 탐색을 다시
    #  시작한다. 배수구 1개짜리 시연에서 엉뚱한 데로 돌아다니는 그림이 된다.
    #  ☆ 파라미터가 아니라 코드로 못박혀 있다 ☆ 재시도 경로 자체가 없다.
    #    (2026-08-24 에 아무 데도 안 쓰이던 advance_retry 파라미터를 지웠다 —
    #     켤 수 있는 스위치처럼 보이는데 배선이 없어 오히려 위험했다)

    #  ★★ [2026-08-30 실측] 0.5 -> 2.5 ★★ 옛 0.5 는 관성보다 짧았다.
    #  임무 한 판 CAN 덤프에서 MEASURING 진입 후 회전 비트(state_flags 0x04)가
    #  **좌 1.63초 · 우 1.23초** 뒤에 꺼졌다 — 0.5 초면 아직 굴러가는 중에
    #  TOF 표본 수집이 시작된다. 2.5 는 그 1.63 초를 덮는 값이다.
    #  (MOUNTING 을 12초 달리다 서는 구간이라 SETTLE 진입 때보다 관성이 크다 —
    #   SETTLE 진입에서는 0.02~0.42초 만에 꺼졌다)
    settle_time: 2.5          # 모터가 실제로 서고 값이 안정되기를 기다린다

    # ── 판정 ─────────────────────────────────────────────────────────────
    assess_sample_count: 0    # 0 = TOF 노드 기본값을 쓴다

    #  ★ 시험 주입 ★ TOF 노드가 없어도 상태 전이를 검증하려고 둔다.
    #  'OFF' 가 아니면 서비스를 부르지 않고 이 값을 판정으로 쓴다.
    #  OFF | NEEDED | NOT_NEEDED | UNKNOWN
    test_verdict: "OFF"

    # ── 서비스 이름 (아직 없는 노드들) ───────────────────────────────────
    assess_service: "/tof_node/assess_drain"
    capture_service: "/rear_camera_node/capture_drain"
    report_service: "/comms_node/report_drain"
    #  없는 노드를 기다리는 시간. 지나면 포기하고 진행한다 — 임무를 안 멈춘다.
    service_timeout: 3.0

    # ── 임무 ─────────────────────────────────────────────────────────────
    target_count: 1           # 시연: 배수구 1개 판정하고 종료
    mission_timeout: 300.0
    depart_timeout: 5.0       # target_count >= 2 일 때만 쓰인다
    #  mux 는 0.5s 면 이미 세운다. 여기는 그보다 길게 보고
    #  "왜 서 있는지"를 사람에게 알리는 자리다 (미해결 12·12-B).
    avoid_lost_timeout: 5.0

    queue_path: "~/drain_reports.jsonl"
    publish_rate: 20.0
