#  통신 어댑터 — TaskManager(ReportDrain) → server_bridge(토픽 JSON)
#
#  ★ server_bridge 는 서버 팀 코드다. 고치지 않는다 ★
#     그쪽 규격에 맞추는 일은 전부 이 파일과 comms_adapter_node.py 에서 한다.
comms_node:
  ros__parameters:
    #  server_bridge 가 구독하는 토픽 이름 (그쪽 코드에 박혀 있다)
    detection_topic: "/drain_detection"
    status_topic: "/robot_status"

    #  ── 서버 규격 값 (2026-09-05 사용자 결정) ──────────────────────────
    #  ★ 배수구 식별자 — 001 부터 010 까지 돌고 다시 001 ★ (2026-09-05 사용자 결정)
    #  "001로 시작해서 010까지 미션마다 하나씩 증가하게 하고
    #   10개 채워지면 다시 001부터 증가하게 하자"
    #
    #  ★ 번호는 '보고 한 건'마다 오른다 ★ target_count 가 1 이라 지금은
    #  '미션마다'와 같은 말이다. 2 이상으로 올리면 한 임무에서 두 번 올라간다 —
    #  그게 맞다. 안 그러면 서로 다른 배수구가 같은 번호를 받는다.
    #
    #  ★ 안 보낸 건은 번호를 안 쓴다 ★ UNKNOWN(전송 생략)에 번호를 태우면
    #  서버가 받는 번호에 구멍이 생긴다.
    #  ★ 붙임말 ★ 서버 규격의 예가 "D-003" 이다 (server_bridge 규격 주석).
    #  2026-09-05 에 이걸 빼고 "001" 로 보냈다가 사용자가 잡았다 —
    #  숫자만 보내면 서버가 다른 것으로 읽는다.
    drain_id_prefix: "D-"
    drain_id_first: 1
    drain_id_last: 10
    drain_id_digits: 3        # 3 이면 1 -> "001" · 붙임말과 합쳐 "D-001"

    #  ★ 디스크에 남겨야 한다 ★ 이 노드는 임무마다 새로 뜬다.
    #  메모리에만 두면 **매 임무가 001** 이 되어 도는 의미가 사라진다.
    #  임시파일 + rename 으로 쓴다(전원이 그냥 끊기는 로봇이다).
    state_file: "~/drain_comms_state.json"

    #  ★ 고정 1.0 이다 ★ 서버 규격의 confidence 는 '찼다는 확신'인데
    #  우리 판정은 TOF 거리 문턱 비교라 확률값이 없다. 탐지 score 를 넣으면
    #  안 된다 — 그것은 '배수구를 찾은 확신'이지 '찼다는 확신'이 아니다.
    confidence: 1.0

    #  ★★ 판정 불가(UNKNOWN)를 어떻게 할 것인가 ★★
    #  서버 규격의 `full` 은 bool 이라 **판정 불가를 담을 자리가 없다.**
    #    skip       — 아예 안 보낸다 (기본 · 2026-09-05 사용자 결정)
    #                 "unknown이면 실패고 안보내면 되지않나"
    #                 거짓 데이터를 만드느니 데이터를 안 만든다. 로컬 근거는
    #                 ~/drain_reports.jsonl 에 sent:false 로 남는다.
    #    needed     — needs_cleaning 으로 보낸다 (사람이 가서 본다)
    #    not_needed — ★ 쓰지 말 것 ★ 못 잰 것을 '깨끗했다'로 서버에 박는다
    #  ★ 서버 팀이 판정 불가 자리를 규격에 넣어 주면 여기부터 다시 볼 것 ★
    unknown_as: "skip"

    #  ── 상태 하트비트 ─────────────────────────────────────────────────
    #  ★ 이게 있어서 '보고 없음'이 '로봇 죽음'으로 안 읽힌다 ★
    #  UNKNOWN 을 안 보내기로 한 결정이 이 하트비트에 기대고 있다.
    #  ★ 10초다 ★ (2026-09-05 사용자 결정: "로봇 상태는 10초 주기로 발행 받도록 하자")
    #  ★ 이 하트비트가 'UNKNOWN 을 안 보낸다'는 결정을 떠받친다 ★
    #  이게 끊기면 서버는 '보고가 없다'와 '로봇이 죽었다'를 구별할 수 없게 된다.
    #  ★ 0 으로 두지 말 것 ★
    status_period: 10.0       # 초. 0 이하면 상태를 안 보낸다

    #  ★ 옛 배터리 값을 살아 있는 값처럼 보내지 않는다 ★
    #  이 시간 넘게 /battery/state 가 안 오면 battery 를 null 로 보낸다.
    #  (can_params.yaml 의 battery_status_timeout 3.0 보다 넉넉하게)
    #  ★ 상태 주기(10초)와는 무관하다 ★ /battery/state 는 원래 약 10Hz 로 온다.
    #  주기를 늘렸다고 이 값을 같이 늘리면 **끊긴 배터리를 살아 있는 값으로 보낸다.**
    battery_stale: 5.0
