# =============================================================================
#  drain_tof · tof_node 파라미터
# =============================================================================
#  이 파일을 고치면 재빌드 없이 노드 재시작만으로 반영된다.
#  (colcon build 로 install 에 복사된 사본이 실행되므로 소스를 고쳤으면 재빌드)
# =============================================================================

tof_node:
  ros__parameters:

    #  can_manager 가 0x410 을 풀어 여기에 발행한다. 이 노드는 CAN 을 안 연다.
    status_topic: "/tof/status"

    # ── 표본 ─────────────────────────────────────────────────────────────
    #  ★ [2026-08-25 실측] 0x410 주기는 100ms 가 아니라 1.000초다 ★
    #  실 can0 에서 32초에 32프레임, 간격 998.0~1003.2ms (19/31 이 999.9ms).
    #  그전 값(표본 5개 / 타임아웃 2.0초)은 100ms 가정 위에 얹혀 있었다 —
    #  1Hz 에서는 2초에 2개밖에 안 모이고, **중앙값 2개는 중앙값이 아니다**
    #  (두 값의 평균이라 튄 프레임이 절반의 무게로 그대로 들어온다).
    #  표본 3개면 한 프레임 튐을 실제로 죽인다. 1Hz 에서 최악 3.1초쯤 걸린다.
    #
    #  ★ 이 시간이 TaskManager 의 service_timeout(3.0) 에 안 걸린다 ★
    #  그 값은 **서비스가 나타나기를 기다리는 시간**이고, call_async 를 던진
    #  뒤의 응답 대기는 mission_timeout(300초)까지 열려 있다. 코드로 확인함.
    #  MEASURING 은 settle_time + 여기 걸리는 시간만큼 로봇을 세워 둔다.
    #
    #  ★★ [2026-08-30 실측 근거] 3 -> 5 ★★
    #  임무 한 판 CAN 덤프에서 **MEASURING 진입 후 회전 비트(0x04)가
    #  좌 1.63초 · 우 1.23초 뒤에야 꺼졌다** — 그동안 로봇이 아직 굴러간다.
    #  1Hz 라 표본 3개면 그중 1~2개가 그 구간에 걸리고, 3개의 중앙값은
    #  불량 1개까지만 견딘다. 5개면 2개까지 견딘다.
    #  (관성 자체는 task_params 의 settle_time 0.5 -> 2.5 로 함께 덮었다)
    sample_count: 5
    #  ★ 표본 5개 x 1Hz 면 최악 5.1초쯤 걸린다 ★ 3.5 로 두면 5개를 못 채우고
    #  중간에 끊겨 sample_count 를 올린 의미가 없어진다. 여유를 두고 7.0.
    sample_timeout: 7.0       # 이 안에 못 모으면 모인 것으로 판정한다
    #  1Hz 이므로 프레임 사이 간격만으로도 0.5초는 우습게 넘는다.
    #  옛 0.5 를 두면 정상 수신 중에도 '두절'로 읽힐 자리였다.
    stale_timeout: 2.5

    # ── ★ 문턱값 — 2026-08-25 사용자 규격으로 확정 ★ ─────────────────────
    #  ★ 이 순서가 지켜져야 한다 ★
    #      plate_reject_below_cm  <  needed_below_cm  <  max_valid_cm
    #  어긋나면 기동 시 ERROR 로 알려 준다. 어긋난 채 두면 판정이 한쪽으로 굳는다.
    #
    #  사용자 규격(원문):
    #    "6개의 측정값 평균이 20cm~5cm이면 배수구 청소를 해야한다는 신호를 보낼꺼고,
    #     각 TOF센서의 측정값이 5cm미만이면 그건 배수구 자체를 인식하는거기 때문에
    #     무시할꺼야(한개의 TOF센서의 측정값이 3cm이면 무시하고 나머지 5개
    #     TOF센서들끼리의 평균값만 계산)"
    #
    #  ☆ '평균 20~5cm' 의 아래끝 5 를 따로 안 넣은 이유 ☆
    #    센서별로 5cm 미만을 **먼저 버리므로** 남은 값은 전부 5cm 이상이고,
    #    그 평균도 반드시 5cm 이상이다. 아래끝은 자동으로 지켜진다.
    #    따로 문턱을 하나 더 두면 같은 규칙이 두 곳에 생겨 어긋날 자리만 만든다.
    #
    #  ☆ 경계값 ☆ 판정은 `평균 < 30.0` 이라 정확히 30.0 은 NOT_NEEDED 다.
    #    센서별 버림은 `< 5.0` 이라 정확히 5.0 은 살아남는다(= "5cm미만이면 무시").
    #
    #  ★★ [2026-09-05 사용자 결정] 청소 문턱 20.0 -> 30.0 ★★
    #  사용자 원문: "청소가 필요하다는 판단 임계값을 30cm로 수정해줘."
    #  ★ 위 08-25 규격 원문("평균이 20cm~5cm")은 지우지 않는다 ★ 그때의 근거이고,
    #    지금 값이 그것을 대체했다는 사실 자체가 기록이다.
    #  ★ 이 값을 바꾸면 화면의 흰 선도 같이 움직인다 ★ mission_view.py 는 이 파일을
    #    읽어 문턱선을 그린다(하드코딩 아님). 다만 **읽는 시점이 기동 때**라
    #    감시 화면과 tof_node 를 다시 띄워야 반영된다.
    #  ★ 아래끝 5 는 그대로다 ★ 센서별로 5 미만을 먼저 버리므로 자동으로 지켜진다.
    #  ★★ [2026-09-05 사용자 결정] 구조물 문턱 5.0 -> 12.0 ★★
    #  사용자 원문: "구조물로 인식하는 임계값을 12cm로 변경했어."
    #  ★ 08-25 규격 원문("5cm미만이면 무시")은 위에 그대로 남긴다 ★ 그때의 근거다.
    #  ★ 아래끝이 5 에서 12 로 같이 올라간다 ★ 센서별로 12 미만을 먼저 버리므로
    #    남은 값의 평균은 자동으로 12 이상이다. 따로 문턱을 두지 않는다.
    plate_reject_below_cm: 12.0   # 이보다 가까우면 배수구 구조물 자체 -> 버린다
    needed_below_cm: 30.0         # 유효 평균이 이보다 짧으면 청소 필요
    max_valid_cm: 200.0           # 이보다 멀면 범위 밖 -> 버린다
    min_valid_sensors: 2          # 유효 센서가 이보다 적으면 UNKNOWN

    #  ★★★ 잠정값이다 — 팀 시험 전까지 확정으로 읽지 말 것 ★★★
    #  [2026-08-25 사용자 결정] "TOF 로직은 팀원 다같이 있을 때 테스트 해보고 만들어야 할 것 같다."
    #  그래서 아래 숫자는 **규격대로 넣어 두고 동작까지 확인한 상태**이지
    #  **팀이 합의·검증한 값이 아니다.** 바꿔야 할 수도 있다.
    #
    #  ★ 팀 시험 때 먼저 볼 것 — 문턱보다 이게 위다 ★
    #  2026-08-25 실측에서 **6개 중 1번 센서만 손에 반응했다.**
    #  3·6번은 255 고정, 4·5번은 1 고정이었다.
    #  **4개가 죽어 있으면 문턱을 아무리 맞춰도 판정이 성립하지 않는다**
    #  (min_valid_sensors=2 를 못 넘겨 UNKNOWN 이 된다).
    #  절차: `python3 ~/tools/tof_live_check.py 60` — 센서를 하나씩 8초씩 가린다.
    #        CAN 무송신이라 안전하다. 센서 생존 + 물리배치 매핑이 함께 나온다.
    #
    #  ★ 그 다음이 문턱 대조다 ★ 실제 배수구 앞에서:
    #   ① 깨끗한 배수구의 평균이 30 **위**인가
    #   ② 청소가 필요한 배수구의 평균이 30 **아래**인가
    #   ③ 구조물 반사가 정말 12 **아래**로 찍히는가   (2026-09-06: 5 -> 12)

    # ── 시험 주입 ────────────────────────────────────────────────────────
    #  ★ 시험 전용 ★ 6개를 넣으면 /tof/status 를 보지 않고 이 값으로 판정한다.
    #  TOF 보드 없이 판정 로직만 확인할 때 쓴다. 빈 문자열이면 꺼진다.
    #  예) "3,12,11,13,0,12"   -> 3은 5cm 미만이라, 0은 측정 실패로 버려진다
    #  ★ 배열이 아니라 문자열이다 ★ rclpy 는 빈 배열의 타입을 못 잡아
    #  yaml 에 [] 를 두면 노드가 기동하다 죽는다(2026-08-24에 겪음).
    simulate_distances: ""
