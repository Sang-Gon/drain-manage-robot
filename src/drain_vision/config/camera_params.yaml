# =============================================================================
#  drain_vision · camera_publisher 파라미터
# =============================================================================
#  이 파일을 고치면 재빌드 없이 노드 재시작만으로 반영된다.
#  (단, colcon build로 install 폴더에 복사된 사본이 실행되므로,
#   소스를 고쳤으면 colcon build를 다시 하거나 --symlink-install 사용)
# =============================================================================

camera_publisher:
  ros__parameters:

    # ── 카메라 ───────────────────────────────────────────────────────────
    #  ★★★ 번호(0, 1, ...)로 쓰지 말 것 — 2026-08-24 에 경로로 바꿨다 ★★★
    #  /dev/videoN 의 N 은 USB 열거 순서로 정해져 재부팅·재연결로 바뀐다.
    #  이 로봇에는 이제 카메라가 두 대다 — C270(앞·탐지) · C920(뒤·캡쳐).
    #  번호로 잡으면 어느 날 **앞뒤가 뒤바뀐다.** 그러면 후방 캡쳐에 앞 화면이
    #  찍히는데, 사진은 남으므로 **틀렸다는 것조차 서버에서 알 수 없다.**
    #    $ ls /dev/v4l/by-id/          <- 여기서 확인한다
    #  ※ C270 도 index0(영상) / index1(메타데이터) 둘을 만든다. index0 을 쓸 것.
    #  ※ 카메라를 다른 개체로 교체하면 일련번호가 달라진다. 그때 다시 확인할 것.
    #  ※ 정수를 넣어도 그대로 동작한다(옛 설정 호환).
    camera_device: "/dev/v4l/by-id/usb-046d_C270_HD_WEBCAM_200901010001-video-index0"
    width: 640                 # C270 최대 1280x720. 탐지는 640으로 letterbox 되므로 640 유지
    height: 480
    frame_rate: 10             # 발행 주기(Hz). Hailo 추론이 못 따라오면 낮출 것

    # ── 토픽 ─────────────────────────────────────────────────────────────
    image_topic: "/image_raw"
    frame_id: "camera"         # TF 프레임 이름 (base_link -> camera 는 아직 없음)
