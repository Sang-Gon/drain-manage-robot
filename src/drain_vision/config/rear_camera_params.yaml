# =============================================================================
#  drain_vision · rear_camera_node 파라미터 (후방 카메라 캡쳐)
# =============================================================================
#  이 파일을 고치면 재빌드 없이 노드 재시작만으로 반영된다.
#  (colcon build 로 install 에 복사된 사본이 실행되므로 소스를 고쳤으면 재빌드)
# =============================================================================

rear_camera_node:
  ros__parameters:

    # ── 장치 ─────────────────────────────────────────────────────────────
    #  ★★★ 번호(0, 2, ...)로 쓰지 말 것 ★★★
    #  USB 열거 순서는 재부팅·재연결로 바뀐다. 번호로 잡으면 어느 날
    #  **앞 카메라(C270)를 후방으로 찍는다.** by-id 경로는 모델명으로
    #  만들어지므로 순서가 바뀌어도 같은 장치를 가리킨다.
    #    $ ls /dev/v4l/by-id/          <- 여기서 확인한다
    #  ※ C920 도 index0(영상) / index1(메타데이터) 둘을 만든다. index0 을 쓸 것.
    camera_device: "/dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920-video-index0"

    #  ★ MJPG 를 유지할 것 ★ YUYV 로 열리면 같은 해상도에서 USB 대역을
    #  훨씬 많이 먹는다. 앞 카메라가 같은 버스에 있으므로 서로 방해한다.
    #  실측(2026-08-24): 이 설정으로 1280x720 @ 30fps 로 협상됐다.
    fourcc: "MJPG"
    width: 1280
    height: 720

    # ── 캡쳐 ─────────────────────────────────────────────────────────────
    #  막 연 카메라의 첫 프레임은 자동노출·화이트밸런스가 수렴하기 전이라
    #  어둡거나 색이 튄다. 사람이 보고 판단할 물증이므로 버린다.
    #  실측: 열기 0.42초 + 8프레임 ≒ 총 1.2초.
    warmup_frames: 8

    open_retry: 2              # 열기 실패 시 재시도 횟수
    retry_delay: 0.3

    #  ★ false = 필요할 때만 연다 (기본) ★
    #  후방 카메라는 배수구 하나당 사진 한 장이다. 그 한 장 때문에
    #  임무 내내 USB 대역을 잡으면 앞 카메라 탐지를 방해한다.
    #  true 로 두면 장치를 계속 열어 두고 캡쳐가 즉시 끝난다 —
    #  캡쳐가 잦아지면 그때 켤 것.
    keep_open: false

    # ── 저장 ─────────────────────────────────────────────────────────────
    #  파일명은 YYYYMMDD_HHMMSS_<tag>.jpg. tag 는 TaskManager 가 seq000 형태로 준다.
    save_dir: "~/drain_captures"
    jpeg_quality: 90
