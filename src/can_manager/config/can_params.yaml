# =============================================================================
#  can_manager 파라미터
# =============================================================================
#  이 파일을 고치면 재빌드 없이 노드 재시작만으로 반영된다.
#  (단, colcon build로 install 폴더에 복사된 사본이 실행되므로,
#   소스를 고쳤으면 colcon build를 다시 하거나 --symlink-install 사용)
# =============================================================================

can_manager:
  ros__parameters:

    # ── CAN 인터페이스 ───────────────────────────────────────────────────
    can_interface: "can0"        # 하드웨어 없이 테스트할 땐 "vcan0"
    can_bustype: "socketcan"

    # ── 기구 제원 ─────────────────────────────────────────────────────
    #  [2026-08-22 확정] wheel_radius = 0.071
    #    바퀴 제품 제원상 지름 142mm -> 반경 71mm. 종전 가정 0.085 는 근거 없는 값이었다.
    #    ★ /odom 대조로 보정하지 말 것 ★ — /odom 은 2:1 스케일이 의심되는 피드백에서
    #    나오므로 반경 오차와 스케일 오차가 한 숫자에 섞인다(미해결 2번).
    #  [2026-08-22 실측] wheel_separation = 0.40 (사용자 실측 "약 40cm")
    #    종전 0.42 는 추정값이었다. "약" 이므로 정밀 회전각이 필요해지면 다시 잴 것.
    wheel_radius: 0.071          # [m] 바퀴 반경 (지름 142mm 제품 제원, 2026-08-22)
    wheel_separation: 0.40       # [m] 좌우 바퀴 중심 간 거리 (실측 약 40cm, 2026-08-22)
    gear_ratio: 2.0              # ★2026-08-22 육안 실측으로 확정 (1.0 -> 2.0)★

    #  ★★★ [2026-08-22] 2:1 스케일은 실재한다 — 육안 회전수로 확정 ★★★
    #
    #  방법: 바퀴를 띄우고 30/60/120/240rpm 을 각 30초 명령, 바퀴 회전수를 눈으로 셌다.
    #        (~/tools/rpm_sweep.sh · 피드백 rpm 은 못 믿을 값이라 육안이 유일한 진실)
    #
    #    명령rpm   바퀴수/30초   실제rpm   실제/명령
    #        30        3.5          7.0      0.233
    #        60       12            24.0     0.400
    #       120       28            56.0     0.467
    #       240       59           118.0     0.492   <- 0.5 에 수렴
    #
    #  [결론 1] **바퀴는 명령의 절반으로 돈다.** 그래서 gear_ratio=2.0.
    #           이제 cmd_vel 의 m/s 가 실제 속도와 맞는다(고속에서 98%).
    #
    #  [결론 2] **저속에서는 그 절반에도 못 미친다.** 기대(명령/2) 대비 부족분이
    #           명령 240/120/60/30 에서 각각 2/4/6/8 rpm 이다.
    #           30rpm 명령은 기대의 47% 뿐이고 **사용자 육안으로 "뚝뚝 끊긴다".**
    #           **60rpm 명령부터 부드럽다**(사용자 확인). 이것이 실용 하한이다.
    #           -> 명령값 60 미만을 쓰지 말 것. v 로는 0.223 m/s.
    #
    #  [주의] 이 2.0 은 **명령 경로**를 맞춘 값이다. 피드백은 별도로 더 틀어져 있다
    #         (명령 240 에 보고 476 — 실제 바퀴 118 의 약 4배). /odom 은 여전히 틀린다.
    #         피드백을 살릴 때 다시 볼 것 (미해결 1·15번).
    max_rpm: 300.0               # 출력 상한 (BLDC 사양은 ±3000)

    # ── 배선에 따른 회전 방향 반전 ───────────────────────────────────────
    #  teleop으로 전진시켰을 때 한쪽만 반대로 돌면 해당 값을 뒤집을 것
    invert_left: false
    invert_right: false          # ★2026-08-22 true -> false. 아래 [결정] 참조★

    #  ★★★ [2026-08-22 결정] 피드백을 버리고 명령 쪽을 맞췄다 ★★★
    #
    #  [배경] BLDC 담당자와 사용자 협의: SLAM/Nav2 를 미루므로 **피드백은 무시**한다.
    #         피드백이 필요한 곳은 /odom 뿐이고, /odom 을 쓰는 곳이 지금은 없다.
    #
    #  [그래서] invert_right 는 원래 **피드백 부호**를 맞추려고 true 였다.
    #         그런데 이 노드는 invert 를 명령과 피드백에 **대칭으로** 적용한다
    #         (can_manager_node.py:493-508). 그래서 true 이면 **직진 명령에
    #         0x200 이 (+30, -30) 으로 나가 로봇이 제자리에서 돈다.**
    #         실제로 2026-08-22 시험에서 (30, -30) 이 나가고 있었다.
    #
    #         피드백을 버리기로 한 이상 맞춰야 할 것은 명령뿐이다.
    #         2026-08-17 육안 확인: 좌·우 모두 **원시 + = 전진**. 따라서 반전 불필요.
    #         -> invert_right: false. **이제 직진 명령에 두 바퀴가 같은 방향으로 돈다.**
    #
    #  [대가] /odom 은 이제 확실히 틀린다(우측 부호가 뒤집힌 채로 들어온다).
    #         **SLAM/Nav2 를 붙이기 전에 반드시 다시 볼 것.**
    #         그때는 invert 를 명령용/피드백용으로 쪼개야 한다(미해결 1번).
    #         publish_odom / publish_tf 는 일단 켜 둔 채로 남긴다 —
    #         지금 소비자가 없어서 해가 없고, 끄면 나중에 켜는 것을 잊는다.

    #  ★★★ 경고 — 이 값은 현재 틀렸을 가능성이 높다 (2026-08-17 실측) ★★★
    #
    #  [실측 사실]  invert를 모두 끄고 한쪽씩 원시 +600을 넣어본 결과:
    #      좌 M0 : 명령 +600 -> 보고 +301,  바퀴는 전진 방향으로 회전
    #      우 M1 : 명령 +600 -> 보고 -315,  바퀴는 전진 방향으로 회전
    #    (회전 방향은 육안 관찰. 회선 데이터는 raw_dir_test 증거 이미지 참조)
    #
    #  [의미]  명령은 양쪽 다 '+ = 전진'이라 반전이 필요 없는데,
    #          피드백은 우측만 부호가 뒤집혀 있다.
    #          즉 명령과 피드백이 서로 다른 설정을 요구한다.
    #
    #  [문제]  can_manager_node.py 는 invert_right 를 명령(_twist_to_rpm)과
    #          피드백(_rpm_to_twist) 양쪽에 '대칭으로' 적용한다.
    #          하나의 플래그로는 이 하드웨어를 표현할 수 없다.
    #
    #  [현재 true 로 두면]  직진 명령 시 우측에 음수가 나가 우측 바퀴가 후진한다.
    #                       -> 로봇이 직진하지 않고 제자리에서 돈다.
    #                       (바퀴를 띄운 상태에서는 육안으로 구분되지 않으니 주의)
    #
    #  [false 로 바꾸면]  직진은 올바르게 되지만 /odom 의 우측 부호가 뒤집혀
    #                     선속도/각속도가 엉킨다. SLAM 에 쓸 수 없다.
    #
    #  [해결 방향 — 둘 중 하나]
    #    (A) BLDC 팀이 ECU 의 피드백 부호를 명령 부호와 일치시킨다  ← 권장
    #        그러면 invert_right: false 로 두고 끝난다.
    #    (B) 노드에 피드백 전용 파라미터(예: invert_right_feedback)를 추가해
    #        명령과 피드백을 분리한다.
    #
    #  결정 전까지 실차 주행 금지. 반드시 바퀴를 띄운 상태에서만 시험할 것.

    # ── 안전 타임아웃 [s] ────────────────────────────────────────────────
    #  상대 ECU 송신 주기의 3배가 기준 (프레임 한두 개 유실 시 오탐 방지)
    cmd_vel_timeout: 0.3         # 상위 노드 두절 시 정지
    motor_status_timeout: 1.2    # ★2026-08-22 부하 실측 후 유지 확정. 아래 [!] 를 반드시 읽을 것★
    battery_status_timeout: 3.0  # BAT 1s 주기 x3 (주기 미확인)
    #  ★ [2026-08-25 실측] TOF 주기는 100ms 가 아니라 1.000초다 ★
    #  실 can0 32초에 32프레임 · 간격 998.0~1003.2ms. 옛 0.3 은 실제 주기보다
    #  짧아서 **정상 수신 중에도 /can/health 의 tof_stale 이 항상 true** 였다.
    tof_status_timeout: 3.0      # TOF 1.000s 주기 x3 (2026-08-25 실측)

    #  [!] motor_status_timeout 을 0.3 -> 1.2 로 올린 이유 (2026-08-17)
    #      명세서·README는 0x210/0x211이 100ms 주기라고 적고 있으나,
    #      실 BLDC ECU 실측값은 400.0ms 였다 (10초/25프레임, min=max로 흔들림 없음).
    #      타임아웃 0.3s는 실제 수신 주기보다 짧아서 프레임 사이마다 반드시
    #      타임아웃이 걸렸고, 주행 명령을 계속 주는데도 400ms마다 IDLE로
    #      떨어져 실차에서 2.5Hz로 덜컹이는 상태였다.
    #
    #      [대가] 두절 감지가 0.3s -> 1.2s로 느려진다. BLDC ECU가 죽어도
    #             최대 1.2초간 마지막 명령이 계속 나간다. 바퀴를 띄우지 않은
    #             상태에서 시험할 때 특히 유의할 것.
    #
    #      [해결됨 2026-08-22] 실측으로 닫혔다. 아래 가설이 맞았고, 기동 직후 구간도 없었다.
    #
    #  ★ [2026-08-22] "400ms = 워치독 대기 상태" 가설은 틀렸다. 폐기한다 ★
    #      반례: 노드를 죽인 뒤 MAIN 무송신 6초 동안에도 주기가 100.0ms 였다
    #            (평균 100.0 / min 99.2 / max 100.8, 60프레임).
    #      지금까지 관측된 400ms 는 두 가지다.
    #        (a) 전원 인가 후 **한 번도 명령을 받은 적 없는** 상태 (flags bit0=1)
    #            -> 이때 10초 측정 400.0ms, min=max
    #        (b) **모터 구동 중 프레임 유실** -> 유효 주기가 ~400ms 로 보임 (위 [!] 참조)
    #      (a)와 (b)는 서로 다른 현상이다. 워치독과는 직접 관계가 없다.
    #
    #  ★★★ [2026-08-22 실측 결론] 0.3 으로 내리면 안 된다. 1.2 를 유지한다 ★★★
    #
    #      한 번 0.3 으로 내렸다가 되돌렸다. 내린 근거가 반쪽짜리였다.
    #      **모터가 정지한 상태에서만 재고 "100ms 안정"이라고 판단한 것이 오류다.**
    #
    #      [정지 중]  0x210 주기 100.0ms · min=max · 17프레임 흔들림 0
    #      [회전 중]  107 / 399 / 116 / 390 / 134 / 368 / 131 / 381 / 174 / 403 ...
    #                 18개 간격 중 **9개가 300ms 를 넘는다. 최악 402.9ms**
    #
    #      즉 **ECU 가 모터를 구동하는 동안 상태 프레임을 흘린다.**
    #      대략 한 프레임 건너 하나씩 빠져 유효 주기가 ~400ms 가 된다.
    #      0.3 이면 회전할 때마다 stale -> IDLE 로 떨어진다.
    #      이것이 2026-08-17 에 겪은 "2.5Hz 덜컹임" 의 정체로 보인다.
    #
    #      [그래서] 1.2 = 최악 403ms 의 약 3배. 유지한다.
    #      **이 값을 다시 내리려면 반드시 모터를 돌린 상태에서 측정할 것.**
    #      BLDC 팀에 "구동 중 상태 프레임 유실" 로 문의할 것 (미해결 14번).
    #
    #      [부수 확인] 기동 직후 400ms 창은 없다 — 첫 0x200 송신 후 58ms 만에
    #      100ms 로 전환됐다(81프레임 평균 100.0 / min 99.9 / max 100.1, 정지 상태).

    # ── 송신 주기 [s] ────────────────────────────────────────────────────
    #  MAIN이 송신하는 프레임은 0x200 하나뿐이다.
    #  0x200은 BLDC팀 확인 결과 100ms.
    #
    #  ★ [2026-08-22] BLDC측 RX 워치독 확인 + 실측 ★
    #      담당자 추정: "500ms 정도" (본인도 불확실하다고 함).
    #      **실측 결과 그보다 훨씬 느리다.** 회전 중 노드를 SIGKILL 한 3회 시험:
    #        1회차: 마지막 0x200 이후 +920ms 에 rpm 0 / flags 0x04 -> 0x00
    #        2회차: +918ms(M1) / +1017ms(M0)  · flags 0x04 -> 0x00
    #        3회차: +1298ms 까지 rpm 335 로 회전 중, +1698ms 에 0 / flags 0x05 -> 0x01
    #      -> **바퀴는 마지막 명령 후 0.9 ~ 1.7초까지 계속 돌았다.**
    #      (관성 감속과 워치독 지연을 분리할 수단이 없다. 전류 필드는 정지 후에도
    #       0.25A 로 고정돼 못 쓴다. 하지만 **안전 계획에 필요한 값은 "언제까지 도는가"**
    #       이고 그것이 바로 이 수치다.)
    #      ★ 안전 계획에는 500ms 가 아니라 **1.7초**를 쓸 것 ★
    #
    #      [뜻] MAIN이 죽어도 BLDC는 결국 멈춘다 (실측 0.9~1.7초).
    #           이것이 소프트웨어와 무관한 **마지막 안전선**이다.
    #           SIGKILL 처럼 EMERGENCY 를 못 보내고 죽는 경우까지 덮어준다.
    #
    #      [제약] tx_motor_period 를 워치독 근처로 올리면 안 된다.
    #           0.1 은 실측 하한 0.9초 대비 9배 여유다. **0.15 이상으로 올리지 말 것.**
    #
    #      [부작용] 노드가 1초 가까이 멈추면(CPU 경합 등) 모터가 툭 선다.
    #           미해결 12번의 /scan 두절(3.1초)이 재현되면 이쪽도 같이 볼 것.
    tx_motor_period: 0.1

    # ── 오도메트리 ───────────────────────────────────────────────────────
    publish_odom: true
    publish_tf: true
    odom_frame: "odom"
    base_frame: "base_link"

    # ── 기타 ─────────────────────────────────────────────────────────────
    auto_recover_bus_off: false  # 커널 restart-ms 사용을 권장 (아래 참고)
    stop_on_motor_fault: true    # 모터 Fault 시 EMERGENCY 전환
    fault_clear_pulse_frames: 5  # Fault Clear 반복 송신 횟수 (5 x 100ms = 500ms)

    # 참고: bus-off 자동 복구는 커널 레벨이 더 안정적이다.
    #   sudo ip link set can0 up type can bitrate 500000 \
    #       sample-point 0.875 restart-ms 100
